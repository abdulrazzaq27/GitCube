name: Update Git Cube
on:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC / 08:47 IST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: git-cube-weekly
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Generate profiles
        env:
          GH_TOKEN: ${{ secrets.GIT_CUBE_TOKEN || github.token }}
        run: npm run profiles
      - name: Commit changed GIFs and activity summary
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/git-cube.gif assets/git-cube-dark.gif assets/abdulrazzaq27.gif assets/abdulrazzaq27-dark.gif assets/osman-bin-nasir.gif assets/osman-bin-nasir-dark.gif docs/profiles.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update Git Cube [skip ci]'
            git push
          fi
