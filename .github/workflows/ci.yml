name: Verify cube
on:
  push:
    paths-ignore:
      - 'assets/**'
      - '**.md'
      - 'docs/**'
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04 # Match the weekly GIF workflow's rendering environment.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run verify
      - run: npm run test:render
